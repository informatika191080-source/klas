.portrait.is-surprised{animation:hero-surprise .58s ease-out 1}
.portrait.is-happy .live-mouth{animation:none!important;transform:translateY(1px) scaleY(1.5)}
.portrait.is-concerned .live-mouth{animation:none!important;transform:translateY(4px) scaleY(-.72)}
.portrait.is-surprised .live-mouth{animation:none!important;transform:translateY(2px) scaleX(.38) scaleY(1.8)}
@keyframes hero-celebrate{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-5deg)}65%{transform:translateY(-5px) rotate(5deg)}}
@keyframes hero-concern{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes hero-surprise{0%,100%{transform:scale(1)}35%{transform:scale(1.12)}}
.character-reaction-toast{position:fixed;left:50%;bottom:max(88px,calc(env(safe-area-inset-bottom) + 88px));transform:translateX(-50%);z-index:2900;max-width:min(440px,calc(100vw - 30px));width:max-content;padding:12px 17px;border-radius:18px;background:#153956;border:1px solid #81d6ef;color:#f5fcff;box-shadow:0 10px 32px #07152eaa;font-size:14px;font-weight:650;line-height:1.5;text-align:center;pointer-events:none;animation:character-toast-enter .2s ease-out}
.character-reaction-toast[data-tone=concerned]{border-color:#f1bf9a;background:#483849}
.character-reaction-toast[data-tone=happy]{border-color:#80ebca;background:#195247}

@media(prefers-reduced-motion:reduce){.portrait.is-happy,.portrait.is-concerned,.portrait.is-surprised,.character-reaction-toast{animation:none!important}}

/* LIVE CHARACTERS + FLOATING BIP: animation respects accessibility settings */
.portrait{transform-origin:50% 80%;animation:hero-breathe 3.8s ease-in-out infinite;overflow:visible}
.portrait .live-eyes{transform-box:fill-box;transform-origin:center;animation:hero-blink 6.1s infinite}
.portrait .live-mouth{transform-box:fill-box;transform-origin:center;animation:hero-talk 5.2s ease-in-out infinite}
.portrait .live-cheek{animation:hero-cheek 4s ease-in-out infinite}
@keyframes hero-breathe{0%,100%{transform:translateY(0) rotate(-.65deg)}50%{transform:translateY(-3px) rotate(.65deg)}}
@keyframes hero-blink{0%,42%,45%,100%{transform:scaleY(1)}43%{transform:scaleY(.13)}}
@keyframes hero-talk{0%,17%,26%,100%{transform:scaleY(1)}20%,23%{transform:scaleY(1.65)}}
@keyframes hero-cheek{0%,100%{opacity:.18}50%{opacity:.48}}
.live-bip{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:3000;font-family:inherit;color:#f3faff;pointer-events:none}
.live-bip button{font:inherit;cursor:pointer}

.live-bip-launch:hover{transform:translateY(-3px)}
.live-bip-launch:focus-visible,.live-bip-panel button:focus-visible{outline:3px solid #ffdc73;outline-offset:3px}
.live-bip-face{width:49px;height:49px;display:grid;place-items:center;flex:none;position:relative;animation:live-bob 2.8s ease-in-out infinite}
.live-bip-head{width:43px;height:39px;border-radius:16px;background:linear-gradient(135deg,#b6fffc,#70bbff);border:3px solid #fff;box-shadow:0 0 15px #59f4e2a0;position:relative;display:flex;justify-content:center;align-items:center;gap:8px}
.live-bip-head:before{content:'';position:absolute;top:-13px;left:18px;width:4px;height:10px;border-radius:4px;background:#8be8ff}
.live-bip-head:after{content:'';position:absolute;top:-18px;left:16px;width:8px;height:8px;border-radius:50%;background:#ffe17a}
.live-bip-eye{height:11px;width:7px;border-radius:5px;background:#19336c;animation:live-blink 5.4s infinite}
.live-bip-head i{position:absolute;bottom:5px;left:18px;width:9px;height:4px;border-bottom:2px solid #19336c;border-radius:50%}
.live-bip-title{font-weight:850;font-size:15px;letter-spacing:.02em}.live-bip-status{display:block;color:#d1f9ff;font-size:11px;font-weight:500;text-align:left}
.live-bip-unread{position:absolute;right:0;top:-2px;width:11px;height:11px;border-radius:50%;background:#ffe17a;box-shadow:0 0 0 3px #183b72}
.live-bip-panel{pointer-events:auto;position:absolute;right:0;bottom:75px;width:min(350px,calc(100vw - 24px));max-height:min(570px,calc(100dvh - 112px));overflow-y:auto;border:1px solid #90e8ed;background:#102846;color:#f4f9ff;border-radius:22px;box-shadow:0 18px 55px #031626d9;padding:0;animation:live-panel-in .19s ease-out}
.live-bip-panel[hidden]{display:none}
.live-bip-bar{display:flex;align-items:center;gap:10px;padding:15px 16px;background:linear-gradient(100deg,#134c67,#243c89);border-radius:21px 21px 0 0}
.live-bip-bar strong{display:block;font-size:16px}.live-bip-bar small{color:#cbf3fa;font-size:12px}.live-bip-close{margin-left:auto;min-width:42px;min-height:42px;background:#ffffff18;border:1px solid #ffffff45;border-radius:12px;color:white;font-size:24px}
.live-bip-chat{padding:16px;display:grid;gap:12px}.live-bip-message{background:#ffffff0e;border:1px solid #ffffff23;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.live-bip-message strong{color:#85f4e1}
.live-bip-actions{display:grid;gap:8px}.live-bip-actions button{border:1px solid #87dce9;background:#174e66;border-radius:12px;text-align:left;color:#fff;min-height:44px;padding:10px 12px;font-size:14px}.live-bip-actions button:hover{background:#225e83}.live-bip-caption{font-size:11px;color:#b9d5eb;line-height:1.4}
@keyframes live-bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes live-blink{0%,46%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.13)}}
@keyframes live-panel-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:550px){.live-bip{bottom:max(10px,env(safe-area-inset-bottom));right:max(9px,env(safe-area-inset-right))}.live-bip-launch{min-height:54px;padding:4px 11px 4px 5px}.live-bip-face{width:45px;height:45px}.live-bip-title{font-size:13px}.live-bip-panel{bottom:66px;max-height:min(500px,calc(100dvh - 105px))}.live-bip-chat{padding:13px}}
@media(prefers-reduced-motion:reduce){.portrait,.portrait .live-eyes,.portrait .live-mouth,.portrait .live-cheek,.live-bip-face,.live-bip-eye,.live-bip-panel{animation:none!important}.live-bip-launch{transition:none!important}}
/* On-scene character dialogue: tied to decisions and kept inside the mission. */
.scene-character-voice{flex:1 1 100%;order:20;padding:11px 15px;border-radius:15px;background:#153e58;color:#f3fcff;border:1px solid #80d5ef;font-size:14px;line-height:1.5;box-shadow:0 5px 18px #0002;animation:live-panel-in .2s ease-out}
.scene-character-voice[data-tone="happy"]{background:#154d44;border-color:#76eac0}

.scene-character-voice[data-tone="surprised"]{background:#514625;border-color:#f8da89}
@media(prefers-reduced-motion:reduce){.scene-character-voice{animation:none!important}}
/* Characters act out meaningful, short reactions instead of looping the same motion. */
.portrait .live-gesture-left,.portrait .live-gesture-right{transform-box:fill-box;transform-origin:center 80%;transition:transform .22s ease-out}
.portrait .live-gesture-left{transform:rotate(-10deg)}
.portrait .live-gesture-right{transform:rotate(10deg)}
.portrait.is-happy .live-gesture-right{animation:hero-wave .62s ease-in-out 2}
.portrait.is-happy .live-gesture-left{animation:hero-cheer .62s ease-out 1}
.portrait.is-concerned .live-gesture-left{animation:hero-think .8s ease-in-out 1}
.portrait.is-concerned .live-gesture-right{transform:rotate(-21deg)}
.portrait.is-surprised .live-gesture-left{animation:hero-shrug-left .65s ease-out 1}
.portrait.is-surprised .live-gesture-right{animation:hero-shrug-right .65s ease-out 1}
.portrait.is-concerned .live-eyes{transform:scaleY(.68)}
.portrait.is-surprised .live-eyes{transform:scaleY(1.22)}

@keyframes hero-cheer{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(38deg)}}
@keyframes hero-think{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(32deg)}}
@keyframes hero-shrug-left{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(36deg)}}
@keyframes hero-shrug-right{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-36deg)}}
.live-bip{--bip-status:#91f4ea}
.live-bip[data-mood="happy"]{--bip-status:#71f8c9}
.live-bip[data-mood="concerned"]{--bip-status:#ffca90}
.live-bip[data-mood="surprised"]{--bip-status:#ffe77a}
.live-bip[data-mood] .live-bip-launch{border-color:var(--bip-status)}
.live-bip-moment{position:absolute;right:0;bottom:calc(100% + 10px);width:max-content;max-width:min(275px,calc(100vw - 24px));padding:10px 13px;border-radius:14px 14px 4px 14px;background:#103957;border:1px solid var(--bip-status);color:#f6ffff;font-size:13px;font-weight:700;line-height:1.3;box-shadow:0 8px 30px #001e3f88;pointer-events:none;animation:live-panel-in .2s ease-out}
.live-bip[data-mood="happy"] .live-bip-face{animation:hero-celebrate .6s ease-out 1}

@media(max-width:550px){.live-bip-moment{font-size:12px;max-width:195px}}
@media(prefers-reduced-motion:reduce){.portrait .live-gesture-left,.portrait .live-gesture-right{animation:none!important;transition:none!important}.live-bip-moment,.live-bip[data-mood] .live-bip-face{animation:none!important}}

/* Animated character team inspired by the supplied storyboards.
   The figures are SVG vectors, not cropped raster frames. */
.character-team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0 22px}
.character-team.compact{margin:0 0 15px;gap:9px}
.character-member{position:relative;min-width:0;display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #7897b8;border-radius:17px;background:linear-gradient(140deg,#153c63,#142944);color:#f3faff;overflow:hidden}
.character-member:nth-child(2){background:linear-gradient(145deg,#403080,#25284e);border-color:#9276dd}
.character-member:nth-child(3){background:linear-gradient(145deg,#164d80,#1c3256)}
.character-avatar{width:86px;height:86px;flex:none;display:grid;place-items:center;transform-origin:center bottom;animation:char-idle 3.2s ease-in-out infinite}
.character-avatar svg{width:100%;height:100%;overflow:visible}
.character-member:nth-child(2) .character-avatar{animation-delay:-.9s}
.character-member:nth-child(3) .character-avatar{animation-delay:-1.6s}
.character-member strong{display:block;font-size:15px;color:white}
.character-member small{display:block;font-size:12px;color:#c3e8ff;margin:4px 0}
.character-member .character-message{font-size:12px;line-height:1.35;color:#d8ecff;min-height:30px}
.character-member[data-emotion="joy"] .character-avatar{animation:char-hop .6s ease-in-out 2}
.character-member[data-emotion="surprise"] .character-avatar{animation:char-surprise .6s ease-out 1}
.character-member[data-emotion="think"] .character-avatar{animation:char-think .7s ease-in-out 1}
.character-member[data-emotion="explain"] .character-avatar{animation:char-point .65s ease-in-out 1}
.character-member[data-emotion="celebrate"] .character-avatar{animation:char-party .6s ease-in-out 3}
.character-member[data-emotion="joy"]{border-color:#75f6c1}
.character-member[data-emotion="surprise"]{border-color:#ffe18b}
.character-member[data-emotion="think"]{border-color:#ffa88f}
.character-member[data-emotion="celebrate"]{border-color:#77f8db;box-shadow:0 0 25px #6dfed43a}
.character-member .mascot-arm-left,.character-member .mascot-arm-right{transform-box:fill-box;transform-origin:center top}
.character-member[data-emotion="explain"] .mascot-arm-right{animation:char-wave .45s ease-in-out 2}
.character-member[data-emotion="celebrate"] .mascot-arm-left,.character-member[data-emotion="celebrate"] .mascot-arm-right{animation:char-wave .4s ease-in-out 3}
@keyframes char-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes char-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-12px)}70%{transform:translateY(-4px)}}
@keyframes char-surprise{0%,100%{transform:scale(1)}45%{transform:scale(1.13)}}
@keyframes char-think{0%,100%{transform:rotate(0)}45%{transform:rotate(-9deg)}}
@keyframes char-point{0%,100%{transform:rotate(0)}40%{transform:rotate(7deg)}}
@keyframes char-party{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-9px) rotate(-9deg)}70%{transform:translateY(-7px) rotate(8deg)}}
@keyframes char-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.character-team.compact .character-member{padding:7px 10px;gap:7px}
.character-team.compact .character-avatar{width:55px;height:55px}
.character-team.compact .character-member strong{font-size:13px}
.character-team.compact .character-member small{font-size:11px;margin:1px 0}
.character-team.compact .character-message{font-size:11px;min-height:unset}
@media(max-width:920px){.character-team{gap:7px}.character-member{padding:9px;gap:6px}.character-avatar{width:64px;height:64px}.character-member strong{font-size:13px}.character-member small{font-size:11px}}
@media(max-width:680px){.character-team{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:9px 0 12px}.character-member,.character-team.compact .character-member{display:grid;justify-items:center;align-content:start;padding:7px 3px;text-align:center;gap:3px;border-radius:13px}.character-avatar,.character-team.compact .character-avatar{width:54px;height:54px}.character-member strong,.character-team.compact .character-member strong{font-size:11px}.character-member small,.character-team.compact .character-member small{font-size:10px}.character-member .character-message,.character-team.compact .character-message{font-size:10px;min-height:unset}}
@media(prefers-reduced-motion:reduce){.character-avatar,.character-member[data-emotion] .character-avatar,.character-member .mascot-arm-left,.character-member .mascot-arm-right{animation:none!important}}

.character-member .team-action{margin-top:7px;width:100%;padding:7px 9px;min-height:39px;border-radius:10px;background:#e8f6ff;color:#12365b;border:1px solid #a5dbef;font-weight:750;font-size:12px;cursor:pointer}

.character-member .character-message{overflow-wrap:anywhere}

@media(max-width:680px){.character-member .team-action{font-size:10px;min-height:40px;padding:6px 3px}}


/* One notification surface for mission events and guide messages. */
.game-notice{position:fixed;z-index:3100;top:max(14px,calc(env(safe-area-inset-top) + 12px));right:14px;width:min(410px,calc(100vw - 28px));max-height:min(55dvh,480px);overflow-y:auto;border:2px solid #86ddec;border-radius:19px;padding:15px 16px;color:#f8fdff;background:#133c59;box-shadow:0 16px 48px #061b3caa;animation:notice-arrive .2s ease-out;overscroll-behavior:contain}

.character-member .character-message{display:none!important}

/* Interactive investigations for missions 4, 5, 7 and 8 */

/* Shared 5–9 academy routes: isolated from the existing grade-5 game engine. */
.academy-grades{margin:20px 0 20px;padding:19px 22px;border-radius:21px;border:1px solid #6a9fb7a6;background:linear-gradient(125deg,#0e304a,#132d46);box-shadow:0 12px 32px #0003}

function showTransferQuestion(i){
 if(state.screen!=='game'||i!==state.ticket||!missionStatus(i).closed)return;
 const item=TRANSFER_CHECKS[i];if(!item)return;
 showGameNotice({kind:"info",title:"🧠 Перевір себе в новій ситуації",text:item.q,actions:[],duration:0});
 const popup=document.getElementById("mission-notice")||document.getElementById("game-notice");if(!popup)return;
 if(popup.querySelector("[data-transfer-answer]"))return; // Same open question: never append duplicate options.
 const options=document.createElement("div");options.className="notice-actions";
 item.choices.forEach((choice,index)=>{
  const b=document.createElement("button");b.type="button";b.dataset.transferAnswer=String(index);b.dataset.transferMission=String(i);b.textContent=choice;options.appendChild(b);
 });
 popup.appendChild(options);
}
document.addEventListener("click",e=>{
 const answer=e.target.closest("#game-notice [data-transfer-answer],#mission-notice [data-transfer-answer]");if(!answer)return;
 const i=Number(answer.dataset.transferMission),index=Number(answer.dataset.transferAnswer);
 if(!Number.isInteger(i)||i!==state.ticket||state.screen!=="game"||!missionStatus(i).closed)return;
 const item=TRANSFER_CHECKS[i];if(!item||!Number.isInteger(index)||index<0||index>=item.choices.length)return;
 showGameNotice({kind:index===item.good?"complete":"followup",title:index===item.good?"✅ Застосував знання!":"🔎 Поміркуй іще",text:item.why,actions:[],duration:7800});
});
document.addEventListener("click",e=>{
 const button=e.target.closest("[data-transfer-check]");if(!button)return;
 const i=Number(button.dataset.transferCheck);
 showTransferQuestion(i);
});

 let writeOk=false, savedOk=false, consistent=false, detail='';
 try{

  localStorage.setItem(probe,value);
  writeOk=localStorage.getItem(probe)===value;
  localStorage.removeItem(probe);
 }catch(e){try{localStorage.removeItem(probe)}catch(_){}detail='Браузер заблокував локальне сховище.';}
 try{
  const saved=localStorage.getItem(STORAGE);
  if(saved){const parsed=JSON.parse(saved);savedOk=!!parsed&&typeof parsed==='object'&&parsed.results&&typeof parsed.results==='object'&&!Array.isArray(parsed.results);
   if(savedOk){
    const results=parsed.results;
    const validEntries=Object.entries(results).every(([k,v])=>/^[1-8]-[0-2]$/.test(k)&&typeof v==='boolean');
    consistent=validEntries&&validateBackupMilestones(results,parsed.finale||null,parsed.finishedAt||null);
   }
  }else{savedOk=true;consistent=true;}
 }catch(e){detail='Збережені дані не вдалося прочитати.';}
 const all=writeOk&&savedOk&&consistent;
 panel.innerHTML=`<strong>${all?'✅ Запис і читання працюють':'⚠️ Потрібна увага'}</strong><p class="tiny">Запис контрольного значення: ${writeOk?'✅':'❌'} · Читання прогресу: ${savedOk?'✅':'❌'} · Послідовність кроків: ${consistent?'✅':'❌'}.</p><p class="tiny">${safe(detail|| (all?'Тест не змінює результатів учня. Для повної перевірки закрий браузер, відкрий файл знову та звір кількість завершених місій.':'Збережи резервну копію JSON, якщо це можливо, і перевір налаштування браузера.'))}</p>`;
}

/* 5.2: Validate consistency of an imported progress file before replacing saved work.
   Older backup format v1 remains supported; the check concerns logical milestones. */
function validateBackupMilestones(results,finale,finishedAt){
 for(let i=1;i<=8;i++){
  let gap=false;
  for(let step=0;step<3;step++){
   const has=Object.prototype.hasOwnProperty.call(results,`${i}-${step}`);
   if(!has)gap=true;
   else if(gap)return false; // No later step without earlier steps.
  }
 }
 const allDone=Array.from({length:8},(_,i)=>[0,1,2].every(s=>Object.prototype.hasOwnProperty.call(results,`${i+1}-${s}`))).every(Boolean);
 if(finishedAt&&!allDone)return false;
 if(finale){
  if(!Number.isInteger(finale.stage)||finale.stage<0||finale.stage>3)return false;
  if(!Number.isInteger(finale.mistakes)||finale.mistakes<0||finale.mistakes>100000)return false;
  if(finale.done===true&&(!allDone||finale.stage!==3))return false;
  if(finale.stage>0&&!allDone)return false;
  if(finale.stage===3&&finale.done!==true)return false;
 }
 return true;
}
function validateMissionBackup(data){
 const allowed={m1:['intro','diagnose','viewer','copy','edit','newmessage','delivery','done'],m2:['intro','diagnose','printer','sent','message','offline','repair','reprint','done'],m3:['intro','flags','advice','newMessage','followup','review','done'],m6:['intro','diagnose','tab','bridge','second','back','done']};
 function check(m,stages){if(!m||typeof m!=='object'||Array.isArray(m)||!stages.includes(m.stage))throw Error('mission-stage');for(const k of ['mistakes'])if(m[k]!==undefined&&(!Number.isInteger(m[k])||m[k]<0||m[k]>1000000))throw Error('mission-count');for(const k of ['flags','safeActions','picked','sourceChecks'])if(m[k]!==undefined&&(!Array.isArray(m[k])||m[k].length>12||m[k].some(x=>typeof x!=='string'||x.length>200)))throw Error('mission-choices');for(const k of ['notes','query'])if(m[k]!==undefined&&(typeof m[k]!=='string'||m[k].length>250))throw Error('mission-text');}
 for(const [key,stages] of Object.entries(allowed))if(data[key]!==undefined)check(data[key],stages);
 if(data.mNew!==undefined){if(!data.mNew||typeof data.mNew!=='object'||Array.isArray(data.mNew))throw Error('missions');for(const [id,m] of Object.entries(data.mNew)){if(!['3','4','6','7'].includes(id))throw Error('mission-id');check(m,['intro','diagnose','action','update','follow','done']);}}
 return true;
}
async function restoreProgress(file){
 if(!file)return;
 if(file.size>250000){toast('Файл завеликий для резервної копії.');return}
 try{
  const data=JSON.parse(await file.text());
  if(!data||data.format!=='cyfropomich-progress'||data.version!==1||!data.results||typeof data.results!=='object'||Array.isArray(data.results)||!data.labs||typeof data.labs!=='object'||Array.isArray(data.labs))throw Error('format');
  const results=Object.create(null);
  for(const [k,v] of Object.entries(data.results)){
   if(!/^[1-8]-[0-2]$/.test(k)||typeof v!=='boolean')throw Error('results');results[k]=v;
  }
  const labs=Object.create(null);
  for(const [k,v] of Object.entries(data.labs)){
   if(!/^[0-7]$/.test(k)||typeof v!=='boolean')throw Error('labs');labs[k]=v;
  }
  if(data.finishedAt!==null&&data.finishedAt!==undefined&&(typeof data.finishedAt!=='string'||!/^\d{4}-\d{2}-\d{2}T/.test(data.finishedAt)||!Number.isFinite(Date.parse(data.finishedAt))))throw Error('date');
  const missionStates={};
  for(const k of ['m1','m2','m3','m6','mNew','finale']){
   const value=data[k];
   if(value!==undefined){if(!value||typeof value!=='object'||Array.isArray(value))throw Error('state');missionStates[k]=JSON.parse(JSON.stringify(value));}
  }
  if(!validateBackupMilestones(results,missionStates.finale||null,data.finishedAt||null))throw Error('inconsistent progress');
  const coach=Object.create(null);

const NOTICE_LABELS={bayt:"📍 Що робити?",pixel:"💡 Підказка",kiber:"🛡️ Перевірити ризик",next:"➡️ Наступна місія",map:"🗺️ До мапи"};
function closeGameNotice(){clearTimeout(gameNoticeTimer);gameNoticeTimer=null;document.getElementById("game-notice")?.remove();noticeLastKey=""}
function collapseGameNotice(){
 const box=document.getElementById("game-notice");if(!box)return;
 box.dataset.collapsed="true";const b=box.querySelector(".notice-minimize");if(b){b.textContent="▢";b.setAttribute("aria-label","Розгорнути повідомлення");b.setAttribute("aria-expanded","false")}
}
function expandGameNotice(){
 const box=document.getElementById("game-notice");if(!box)return;
 box.dataset.collapsed="false";const b=box.querySelector(".notice-minimize");if(b){b.textContent="−";b.setAttribute("aria-label","Згорнути повідомлення");b.setAttribute("aria-expanded","true")}
}
function showGameNotice({kind="info",title="ЦифроПоміч",text="",actions=[],duration=5600}={}){
 if(['game','lesson','labs'].includes(state.screen)&&window.CyfroUX.feedback({kind,title,text,actions}))return;
 const key=JSON.stringify([state.screen,state.ticket,kind,title,text,actions]);
 const existing=document.getElementById("game-notice");
 // Identical events should not repeatedly obscure the current task.
 if(existing&&noticeLastKey===key)return;
 closeGameNotice();noticeLastKey=key;
 const box=document.createElement("aside");box.id="game-notice";box.className="game-notice no-print";box.dataset.kind=kind;box.dataset.collapsed="false";box.setAttribute("role","status");box.setAttribute("aria-label",title);
 const heading=document.createElement("div");heading.className="notice-head";
 const strong=document.createElement("strong");strong.textContent=title;heading.appendChild(strong);
 const minimize=document.createElement("button");minimize.type="button";minimize.className="notice-minimize";minimize.setAttribute("aria-label","Згорнути повідомлення");minimize.setAttribute("aria-expanded","true");minimize.textContent="−";heading.appendChild(minimize);
 const close=document.createElement("button");close.type="button";close.className="notice-close";close.setAttribute("aria-label","Закрити повідомлення");close.textContent="×";heading.appendChild(close);
 box.appendChild(heading);
 const p=document.createElement("p");p.textContent=text;box.appendChild(p);
 if(actions.length){
  const buttons=document.createElement("div");buttons.className="notice-actions";
  for(const id of actions){if(!NOTICE_LABELS[id])continue;const button=document.createElement("button");button.type="button";button.dataset.noticeAction=id;button.textContent=NOTICE_LABELS[id];buttons.appendChild(button)}
  box.appendChild(buttons);
 }
 document.body.appendChild(box);
 // After a short reading interval, actionable notices shrink rather than blocking the game.
 // They remain expandable so that the user does not lose the choices.
 if(actions.length)gameNoticeTimer=setTimeout(collapseGameNotice,6500);
 else if(duration>0)gameNoticeTimer=setTimeout(closeGameNotice,duration);
}
document.addEventListener("click",e=>{
 if(e.target.closest("#game-notice .notice-close")){closeGameNotice();return}
 if(e.target.closest("#game-notice .notice-minimize")){const box=document.getElementById("game-notice");if(box?.dataset.collapsed==="true")expandGameNotice();else collapseGameNotice();return}
 if(e.target.closest("#game-notice[data-collapsed='true']")){expandGameNotice();return}
 const button=e.target.closest("#game-notice [data-notice-action]");if(!button)return;
 const id=button.dataset.noticeAction;
 closeGameNotice();
 if(id==="map"){go("home");return}
 if(id==="next"){if(state.screen==="game"&&missionStatus(state.ticket).closed){if(state.ticket<7)start(state.ticket+1);else go("report")}return}
 if(state.screen!=="game")return;
 const hero=root.querySelector('.character-member[data-team="'+id+'"] [data-team-action]');
 if(hero)hero.click();
});

let reactionTimer=null;
function missionSnapshot(){
 const i=state.ticket;
 const m=i===0?state.m1:i===1?state.m2:i===2?state.m3:i===5?state.m6:state.mNew?.[i];
 return {screen:state.screen,i,stage:m?.stage||'intro',mistakes:Number(m?.mistakes)||0,results:JSON.stringify(state.results)};
}
function showCharacterReaction(tone,i){
 if(state.screen!=="game"||state.ticket!==i)return;
 const done=missionStatus(i).closed&&coachStage()==='done';
 const mood=tone==="happy"?(done?"celebrate":"joy"):tone==="concerned"?"think":"surprise";
 setTeamEmotion(mood);
 const portraitElement=document.querySelector("main.stage svg.portrait");
 if(portraitElement){portraitElement.classList.remove("is-happy","is-concerned","is-surprised");void portraitElement.getBoundingClientRect();portraitElement.classList.add("is-"+tone)}
 const detail=document.querySelector('main.stage [id$="-feedback"]')?.textContent?.trim();if(detail)window.CyfroUX.revealFeedback();
 if(tone==="concerned"&&!detail)setSceneSignal("error","Це рішення потрібно переглянути. Перевір можливий ризик або попроси підказку.");
 
 
 clearTimeout(reactionTimer);
 reactionTimer=setTimeout(()=>portraitElement?.classList.remove("is-"+tone),1500);
}
root.addEventListener('click',event=>{
 const action=event.target.closest('[data-m1],[data-m2],[data-m3],[data-m6],[data-new],[data-answer]');
 if(!action||state.screen!=='game')return;
 const before=missionSnapshot();
 const previousFeedback=document.querySelector('main.stage [id$="-feedback"]')?.textContent?.trim()||'';
 setTimeout(()=>{
  if(state.screen!=='game'||before.i!==state.ticket)return;
  const after=missionSnapshot();
  const error=after.mistakes>before.mistakes||Object.keys(state.results).some(k=>{
   const prior=JSON.parse(before.results);return prior[k]===undefined&&state.results[k]===false;
  });
  if(error){showCharacterReaction('concerned',before.i);return;}
  if(after.stage!==before.stage){
   if(before.stage==='intro')return;
   const isFollow=coachPhase()==='b'&&(['newmessage','message','newMessage','update','bridge','second'].includes(after.stage));
   showCharacterReaction(isFollow?'surprised':'happy',before.i);
  }else if(after.results!==before.results){
   showCharacterReaction('happy',before.i);
  }else{
   const updatedFeedback=document.querySelector('main.stage [id$="-feedback"]')?.textContent?.trim()||'';
   if(updatedFeedback&&updatedFeedback!==previousFeedback)window.CyfroUX.revealFeedback();
  }
 },0);
},true);

 case 'sent':tip='Документ успішно пройшов через комп’ютер А до принтера.';body=`<h2>Завдання надруковано!</h2>${m2Chat('Ура, документ надруковано без флешки! Дякую!')}${m2Network('success')}`;break;

function m2Action(b){if(state.screen!=='game'||state.ticket!==1)return;let m=m2State(),act=b.dataset.m2;const advance=stage=>{m.stage=stage;persist();render()};const feedback=(message,bad=true)=>{let el=document.getElementById('m2-feedback');if(el){el.className='m2-feedback'+(bad?' bad':'');el.textContent=message;}if(bad){m.mistakes++;persist();beep(false)}};

function mission6(){const m=m6State();let body='',hint='';switch(m.stage){

function m6Action(btn){if(state.screen!=='game'||state.ticket!==5)return;const m=m6State(),action=btn.dataset.m6,feedback=(text,wrong=false)=>{const x=document.getElementById('m6-feedback');if(x){x.className='m6-status'+(wrong?' m6-warn':'');x.textContent=text}};
const step=s=>{m.stage=s;persist();render();};
switch(action){case 'begin':step('diagnose');break;
case 'answer':if(m.stage!=='diagnose')break;if(btn.dataset.value==='tab')window.CyfroUX.pass({title:"Правильно!",text:"Нова сторінка відкрилася в іншій вкладці. Початкова стаття залишилася у попередній вкладці — її можна вибрати.",nextLabel:"Далі →",onNext:()=>{step('tab')}});else{m.mistakes++;persist();feedback('Спробуй ще раз. Артем повідомив, що попередню вкладку не закривав.',true)}break;
case 'tab-article':if(m.stage==='tab'){m.tab='article';m.firstDone=true;persist();render()}break;
case 'tab-new':if(m.stage==='tab'){m.tab='new';persist();render();feedback('Зараз друга вкладка. Для повернення натисни «Світ тварин».',true)}break;
case 'bridge':if(m.firstDone)step('bridge');break;
case 'second':m.visited=false;step('second');break;
case 'follow':if(m.stage==='second'){m.visited=true;persist();render()}break;
case 'go-back-stage':if(m.visited)step('back');break;
case 'back':if(m.stage==='back'&&m.visited){m.visited=false;persist();render()}break;
case 'finish':if(m.stage==='back'&&!m.visited){window.CyfroUX.pass({title:"Сторінку знайдено!",text:"Ти повернув статтю двома способами: перемиканням вкладок і кнопкою «Назад» у межах однієї вкладки.",nextLabel:"Отримати відзнаку →",onNext:()=>{for(let i=0;i<3;i++)state.results[key(5,i)]=true;state.step=3;step('done')}})}break;
case 'restart':state.m6={replaying:true,stage:'intro',tab:'new',visited:false,firstDone:false,mistakes:0};persist();render();break;
}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-m6]');if(b)m6Action(b)});

function mission3(){const m=m3State();let body='',hint='';switch(m.stage){
case 'intro':hint='У цій місії ти захищаєш особисті дані. Нічого справжнього вводити не потрібно.';body=`<h2>Операція «Несподіваний подарунок»</h2>${m3Person('Привіт! Мені написала незнайома людина й пообіцяла подарунок. Вона просить мої особисті дані. Я не знаю, як діяти!')}<p>Працюй як фахівець служби підтримки: <strong>помічай тривожні ознаки, радь безпечні дії та реагуй на нові обставини</strong>.</p>${m3Messenger()}<div class="m3-actions"><button class="btn" data-m3="begin">Перевірити повідомлення →</button></div>`;break;
case 'flags':{hint='Вибери всі чотири ознаки, які роблять повідомлення підозрілим. Не кожна деталь є небезпечною сама по собі.';const flags=m.flags||[];body=`<h2>Крок 1. Знайди ознаки небезпеки</h2>${m3Messenger()}<p class="m3-label">Познач чотири тривожні ознаки в повідомленні:</p><div class="m3-flags">${M3_FLAGS.map(([id,label])=>`<button class="m3-flag" data-m3="flag" data-val="${id}" aria-pressed="${flags.includes(id)}">${safe(label)}</button>`).join('')}</div><p class="m3-count">Обрано: ${flags.length} із 5 варіантів</p><div class="m3-actions"><button class="btn" data-m3="confirm-flags">Перевірити ознаки →</button></div>`;break;}

case 'newMessage':hint='Навіть якщо людина вже поділилася номером, ще не пізно припинити розмову й звернутися по допомогу.';body=`<h2>Картка Б. Ситуація змінилася</h2><div class="phase-alert">📬 Надійшло уточнення від Софійки!</div>${m3Person('Я вже встигла надіслати незнайомій людині номер телефону. Домашню адресу не повідомляла, але незнайомець продовжує писати. Що робити тепер?')}${m3Messenger(true)}<div class="m3-actions"><button class="btn" data-m3="follow">Скласти план безпечних дій →</button></div>`;break;
case 'followup':{const selected=m.safeActions||[];hint='Потрібно три безпечні кроки. Можна зупинитися, попросити допомоги та обмежити контакт із незнайомцем.';body=`<h2>Крок 3. Склади план допомоги</h2>${m3Messenger(true)}<p class="m3-label">Обери три безпечні дії:</p><div class="m3-flags">${M3_SAFE.map(([id,label])=>`<button class="m3-flag" data-m3="safe-action" data-val="${id}" aria-pressed="${selected.includes(id)}">${safe(label)}</button>`).join('')}</div><p class="m3-count">Обрано дій: ${selected.length} із 5 варіантів</p><div class="m3-actions"><button class="btn" data-m3="confirm-actions">Перевірити план →</button></div>`;break;}
case 'review':hint='Цей план допомагає зупинити подальшу передачу даних. Довірений дорослий може допомогти з наступними діями.';body=`<h2>Перевір рекомендації перед відповіддю</h2>${m3Person('Дякую! Я припиню листування, повідомлю дорослого та заблокую невідомого відправника.') }<div class="m3-summary"><strong>✅ Безпечний план:</strong><ol class="m3-steps"><li>Не відповідати на наступні повідомлення та не надсилати жодних додаткових даних.</li><li>Розповісти батькам або іншому довіреному дорослому про ситуацію.</li><li>Разом із дорослим заблокувати контакт і скористатися функцією скарги в месенджері.</li></ol></div><p class="m3-explain">Номер телефону вже міг стати відомим незнайомцю, тому важливо бути обережними з новими повідомленнями й дзвінками. Це не означає, що інша інформація автоматично стала відомою.</p><div class="m3-actions"><button class="btn" data-m3="finish">Надіслати безпечну рекомендацію ✓</button></div>`;break;
case 'done':hint='Перемога — це не лише вибір правильної відповіді, а й уміння діяти безпечно, коли обставини змінюються.';body=`<div class="mission-done"><div class="medal">🏅</div><h2>Заявку № 03 закрито!</h2>${m3Person('Тепер я знаю, як упізнати підозріле повідомлення та до кого звернутися. Дякую за допомогу!')}<div class="m3-summary">🛡️ <strong>Відзнака «Захисник даних»</strong><div>Розпізнано шахрайські ознаки, складено безпечну пораду та враховано нове повідомлення.</div><div>Спроб і виправлень: <strong>${m.mistakes||0}</strong>. За виправлення помилок бали не знімаються.</div></div>${lessonRecap(2)}<div class="m3-actions" style="justify-content:center"><button class="btn" data-ticket="3">Наступна місія →</button></div></div>`;break;
}
return `<div class="game-layout"><div>${sidebar()}</div><main class="panel stage m3"><div class="m3-head"><div class="m3-avatar">${portrait(2)}</div><div><div class="caps">ЗАЯВКА 03 · 5 КЛАС</div><h2 style="margin:4px 0">Софійка: підозріле повідомлення</h2><span class="tiny">Картка ${['intro','flags','advice'].includes(m.stage)?'А':'Б'} · симуляція безпечного листування</span></div></div><div class="m3-progress" role="progressbar" aria-label="Проходження заявки" aria-valuenow="${M3_PROGRESS[m.stage]||0}" aria-valuemin="0" aria-valuemax="100"><i style="width:${M3_PROGRESS[m.stage]||0}%"></i></div>${body}<div id="m3-feedback" aria-live="polite"></div><div class="m3-actions"><button class="btn ghost" data-go="home">← До місій цієї теми</button></div></main></div>`;
}
function m3Action(b){if(state.screen!=='game'||state.ticket!==2)return;const m=m3State(),a=b.dataset.m3,val=b.dataset.val;const advance=stage=>{m.stage=stage;persist();render()};const feedback=(msg,bad=true)=>{const el=document.getElementById('m3-feedback');if(el){el.className='m3-feedback'+(bad?' bad':'');el.textContent=msg;}if(bad){m.mistakes++;persist();beep(false)}};const toggle=(arr,id)=>{const pos=arr.indexOf(id);if(pos>=0)arr.splice(pos,1);else arr.push(id);persist();render()};switch(a){
case 'begin':if(m.stage==='intro')advance('flags');break;
case 'flag':if(m.stage==='flags')toggle(m.flags,val);break;
case 'confirm-flags':if(m.stage!=='flags')break;if(m.flags.length===4&&['unknown','prize','private','hurry'].every(k=>m.flags.includes(k))){window.CyfroUX.pass({title:"Правильно!",text:"Ти помітив невідомого відправника, обіцянку подарунка, запит особистих даних і тиск поспішати. Разом ці ознаки попереджають про небезпеку.",nextLabel:"Далі →",onNext:()=>{state.results[key(2,0)]=true;advance('advice')}})}else feedback('Знайди всі чотири тривожні ознаки. Звичайне привітання саме по собі не доводить шахрайства.');break;
case 'advice':if(m.stage!=='advice')break;if(val==='safe'){window.CyfroUX.pass({title:"Правильно!",text:"Не надсилаємо особистих даних незнайомцю. Перевірити підозріле прохання допоможе довірений дорослий.",nextLabel:"Далі →",onNext:()=>{state.results[key(2,1)]=true;advance('newMessage')}})}else feedback(val==='phone'?'Навіть номер телефону є особистими даними. Для неперевіреного подарунка його надсилати не потрібно.':'Продовжувати розмову з підозрілим відправником не варто. Обери безпечну дію.');break;

 return `<div class="game-layout">${sidebar()}<main class="panel stage v4-layout"><div class="v4-heading"><div class="v4-face">${portrait(i)}</div><div><div class="caps">ЗАЯВКА № ${String(i+1).padStart(2,'0')} · 5 КЛАС</div><h2 style="margin:5px 0">${safe(d.name)}: ${safe(d.title)}</h2><span class="tiny">Картка ${phase} · інтерактивна місія</span></div></div><div class="v4-track" role="progressbar" aria-label="Прогрес місії" aria-valuenow="${NEW_STAGES[m.stage]||0}" aria-valuemin="0" aria-valuemax="100"><i style="width:${NEW_STAGES[m.stage]||0}%"></i></div>${body}<div id="v4-feedback" aria-live="polite" role="status"></div><div class="v4-footer"><button class="btn ghost small" data-go="home">← До мапи місій</button><span class="tiny">Навчальна симуляція — реальні файли, сайти та паролі не використовуються</span></div></main></div>`;
}
function newMissionAction(button){if(state.screen!=='game'||![3,4,6,7].includes(state.ticket))return;const i=state.ticket,m=newMissionState(i),a=button.dataset.new,val=button.dataset.val||'';
 const feedback=(msg)=>{m.mistakes++;persist();beep(false);let el=document.getElementById('v4-feedback');if(el){el.className='v4-status bad';el.textContent='🤖 БІП: '+msg;}};
 const advance=(stage)=>{m.stage=stage;state.step=nextMissing(i)??3;persist();beep();render()};
 const explanations={3:['Зображення з інтернету не завжди можна вільно використовувати. Спочатку з’ясовуємо авторство та умови.','Ти перевірив авторку й дозвіл на використання. Тепер можна виконати конкретні умови.','У підписі є і авторка, і джерело — саме цього вимагають умови використання.'],4:['Початковий запит був надто широким. Назва твору та потрібний вид матеріалу звужують пошук.','Точні ключові слова допомогли знайти потрібний текст. Далі перевіримо умови доступу.','Для читання казки не потрібно віддавати номер телефону сумнівному сайту. Обране джерело не вимагає зайвих даних.'],6:['Спільна папка зберігається на комп’ютері А. Для доступу цей комп’ютер має працювати.','Після відновлення роботи комп’ютера А спільна папка знову доступна.','Готову локальну копію передано окремою дозволеною дією. Чужі документи не замінено.'],7:['Невідомий відправник, несподіване вкладення й вимога вимкнути захист — тривожні ознаки.','Підозрілого вкладення не відкриваємо. Захист залишаємо ввімкненим і звертаємося до дорослого.','Пароль не введено. Ти припинив взаємодію та обрав перевірку пристрою з допомогою дорослого.']};
 const doneStep=(n,next)=>window.CyfroUX.pass({text:explanations[i][n],title:next==='done'?'Місію виконано!':'Правильно!',nextLabel:next==='done'?'Отримати відзнаку →':'Далі →',onNext:()=>{state.results[key(i,n)]=true;advance(next)}});
 const toggle=(list,x)=>{m[list]=m[list]||[];m[list].includes(x)?m[list]=m[list].filter(v=>v!==x):m[list].push(x);persist();render()};
 
 if(i===3&&a==='inspect-source'&&m.stage==='action'){m.sourceViewed=true;persist();render();return}
 if(i===3&&a==='source-check'&&m.stage==='action'&&m.sourceViewed){toggle('sourceChecks',val);return}
 if(i===4&&a==='query-part'&&m.stage==='action'){
  const input=document.getElementById('v4-search-input');if(!input)return;

  if(!input.value.toLocaleLowerCase('uk-UA').includes(value.toLocaleLowerCase('uk-UA')))input.value=(input.value.trim()+' '+value).trim().slice(0,100);
  m.query=input.value;persist();return;
 }
 if(i===4&&a==='query-clear'&&m.stage==='action'){const input=document.getElementById('v4-search-input');if(input)input.value='';m.query='';persist();return}
 if(i===6&&a==='inspect-access'&&m.stage==='follow'){m.accessInspected=true;persist();render();return}
 if(i===7&&a==='inspect-mail'&&m.stage==='action'){m.mailReviewed=true;persist();render();return}
if(a==='begin'&&m.stage==='intro')return advance('diagnose');
 if(a==='next'&&m.stage==='update')return advance('follow');
 if(a==='diagnose'&&m.stage==='diagnose'){
  const good={3:'verify',4:'broad',6:'host'}[i];
  if(val===good)return doneStep(0,'action');return feedback(i===3?'Не можна вважати, що кожне фото з інтернету дозволено копіювати. Перевір умови використання.':i===4?'Досить уточнити пошуковий запит: назву твору та потрібний тип матеріалу.':'Зверни увагу, де зберігається спільна папка і чи ввімкнено цей комп’ютер.');
 }
 if(i===3){
  if(a==='source'&&m.stage==='action')return val==='open'?(m.sourceViewed&&['author','terms'].every(x=>(m.sourceChecks||[]).includes(x))?(m.sourceOpened=true,doneStep(1,'update')):feedback('Спочатку відкрий картку автора та перевір обидва факти.')):feedback('Не приписуй собі авторство чужого зображення.');
  if(a==='pick'&&m.stage==='follow')return toggle('picked',val);
  if(a==='confirm'&&m.stage==='follow')return m.picked.length===2&&['Марія Д.','Фотобібліотека «Світ природи»'].every(v=>m.picked.includes(v))?doneStep(2,'done'):feedback('Для цього фото потрібно вказати обидва елементи: авторку та джерело.');
 }
 if(i===4){
  if(a==='search'&&m.stage==='action'){m.query=document.getElementById('v4-search-input')?.value.trim().slice(0,100)||'';const q=m.query.toLocaleLowerCase('uk-UA');if(q.includes('рукавичк')&&(q.includes('текст')||q.includes('читат')||q.includes('народн')||q.includes('казк'))){m.found=true;return doneStep(1,'update')}return feedback('Спробуй включити назву «Рукавичка» та слово «казка» або «текст».')}
  if(a==='site'&&m.stage==='follow')return val==='safe'?doneStep(2,'done'):feedback('Для читання народної казки номер телефону не потрібен. Обери безпечне джерело без зайвих вимог.');
 }
 if(i===6){
  if(a==='power'&&m.stage==='action'){m.hostOn=true;persist();render();return}
  if(a==='check-folder'&&m.stage==='action')return m.hostOn?doneStep(1,'update'):feedback('Комп’ютер А, де розміщена папка, ще вимкнений. Попроси відповідальну особу його увімкнути.');
  if(a==='edit-local'&&m.stage==='follow'){m.localEdited=true;persist();render();return}
  if(a==='upload'&&m.stage==='follow')return m.localEdited&&m.accessInspected&&m.uploadPermission?(m.uploaded=true,doneStep(2,'done')):feedback('Потрібно відредагувати свою копію, перевірити дозвіл на додавання файлів і підтвердити, що чужі документи не замінюються.');
 }
 if(i===7){
  if(a==='flag'&&m.stage==='diagnose')return toggle('flags',val);
  if(a==='confirm-flags'&&m.stage==='diagnose')return m.flags.length===3&&['unknown','gift','disable'].every(x=>m.flags.includes(x))?doneStep(0,'action'):feedback('Знайди три ознаки небезпеки: невідомий відправник, несподівана обіцянка та вимога вимкнути захист.');

  if(a==='pick'&&m.stage==='follow')return toggle('picked',val);
  if(a==='confirm'&&m.stage==='follow')return m.picked.length===3&&['stop','adult','scan'].every(v=>m.picked.includes(v))?doneStep(2,'done'):feedback('Не вводь пароль. Потрібно зупинитися, звернутися до дорослого й перевірити пристрій за його допомоги.');
 }
}

const FINAL_KEY='ЦИФРОКОД';
function normalizeFinale(v){
 return v&&typeof v==='object'&&!Array.isArray(v)?{stage:Math.max(0,Math.min(3,Number(v.stage)||0)),mistakes:Math.max(0,Number(v.mistakes)||0),done:v.done===true,feedback:''}:{stage:0,mistakes:0,done:false,feedback:''};
}
function keyTiles(){return [...FINAL_KEY].map((letter,i)=>{
 const unlocked=[0,1,2].every(j=>state.results[key(i,j)]!==undefined);
 return `<span class="key-tile ${unlocked?'':'hidden'}" aria-label="Ключ місії ${i+1}: ${unlocked?letter:'ще заблоковано'}">${unlocked?letter:'?'}</span>`;
}).join('')}
function finalFeature(){const ready=completed()===8;
 return `<section class="final-feature ${ready?'':'locked'}" aria-label="Секретна місія"><div><div class="caps">🗝️ Секретна місія · цифровий ключ</div><h3 style="margin:8px 0">${state.finale?.done?'🏆 Ти врятував цифрове місто!':ready?'🔓 Фінальний виклик відкрито':'🔒 Відкрий фінальну пригоду'}</h3><p class="muted" style="margin:0">${ready?'Усі вісім символів зібрано. Використай знання з різних місій, щоб допомогти службі підтримки в одному складному випадку.':'За кожну завершену заявку ти отримуєш символ ключа. Збери всі 8 і відкрий додатковий сюжетний виклик.'}</p><div class="key-track" aria-label="Зібрані символи ключа">${keyTiles()}</div><span class="tiny">Ключ: ${completed()} із 8 символів. Фінал не впливає на бали та диплом.</span></div><div><button class="btn ${ready?'':'secondary'}" data-go="finale" ${ready?'':'disabled'}>${state.finale?.done?'Переглянути успіх':ready?'Розпочати фінал →':'🔒 Заблоковано'}</button></div></section>`;
}
const FINAL_QUESTIONS=[
 {title:'Звернення з міського центру',story:'У навчальному центрі перестали відкриватися файли зі спільної папки. Інтернет на комп’ютері Б працює, але комп’ютер А, на якому зберігаються файли, вимкнений.',question:'Що перевірити та порадити насамперед?',choices:[['Видалити всі файли з комп’ютера Б','Видалення не відновить доступ і може призвести до втрати даних.'],['Повідомити відповідальну особу й попросити перевірити комп’ютер А','good'],['Змінити паролі інших учнів','Паролі не стосуються описаної несправності, а змінювати чужі облікові записи не можна.']],success:'Чудово! Якщо файли зберігаються на вимкненому комп’ютері А, потрібно відновити його роботу за допомогою відповідальної особи.'},
 {title:'Неочікуваний лист',story:'Поки відповідальна особа відновлює доступ, надійшов лист: «Ми все полагодимо! Відкрий вкладення та введи пароль у вікні». Відправник невідомий.',question:'Як безпечно вчинити?',choices:[['Не відкривати вкладення, не вводити пароль і повідомити дорослого','good'],['Відкрити вкладення, адже треба працювати швидко','Поспіх і прохання ввести пароль — тривожні ознаки.'],['Переслати вкладення всьому класу','Так небезпечне повідомлення потрапить до інших.']],success:'Так! Безпека важливіша за обіцянку швидкого виправлення. Перевіряємо проблему через відомі контакти.'},
 {title:'Завершення допомоги',story:'Доступ до спільної папки відновлено. Потрібно підготувати повідомлення для користувачів і додати до нього фото. Автор дозволяє використати фото для навчання із зазначенням авторства та джерела.',question:'Яке повідомлення є найкращим?',choices:[['«Усе працює. Фото взято з інтернету».','Це не пояснює вирішення проблеми та не виконує умови авторки.'],['«Файли доступні. Фото: Марія Д., фотобібліотека «Світ природи». Якщо проблема повториться, повідомте відповідальну особу».','good'],['«Скопіюйте собі всі чужі файли, щоб не втратити доступ».','Не можна рекомендувати копіювання чужих файлів без дозволу.']],success:'Відмінно! Повідомлення зрозуміле, допомагає користувачам і дотримується умов використання фото.'}

function finaleUI(){
